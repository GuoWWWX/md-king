name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: windows-msvc-build
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm build
      - run: pnpm test:unit
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      # Tag-scoped caches cannot be reused by the next release tag. Populate
      # both build profiles on main, which release runs can restore.
      - name: Warm release dependencies
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $mdCacheConfig = Join-Path $env:RUNNER_TEMP 'md-king-cache-config.json'
          '{"build":{"beforeBuildCommand":""}}' | Set-Content -LiteralPath $mdCacheConfig -Encoding utf8
          pnpm tauri build --no-bundle --config $mdCacheConfig
