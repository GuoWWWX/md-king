name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag, e.g. v1.1.9 (must exist when publishing; verify_only checks main)'
        required: true
        type: string
      verify_only:
        description: 'Verify current main installers and signatures without creating or modifying a Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.verify_only && 'main' || inputs.tag || github.ref }}
          lfs: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate release versions and signing configuration
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Only stable X.Y.Z versions are supported" }
          if ($env:RELEASE_TAG -cne "v$version" -or $tauriVersion -cne $version) { throw "Release versions do not match" }
          if (!(Select-String -Path src-tauri/Cargo.toml -SimpleMatch -Pattern "version = `"$version`"" -Quiet)) { throw "Cargo version does not match" }
          if (!$env:UPDATE_SIGNING_PRIVATE_KEY) { throw "Missing UPDATE_SIGNING_PRIVATE_KEY repository secret" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Find validated installers for this exact commit
        id: reuse
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath scripts/ci-artifacts.mjs) {
            node scripts/ci-artifacts.mjs find bundles
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            "run_id=" >> $env:GITHUB_OUTPUT
            "artifact_id=" >> $env:GITHUB_OUTPUT
            Write-Host 'Historical tag without reuse metadata; run the original validation/build.'
          }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download validated installers
        if: steps.reuse.outputs.artifact_id != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.reuse.outputs.artifact_id }}
          run-id: ${{ steps.reuse.outputs.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: src-tauri/target/release/bundle

      - name: Verify reused installer commit, version and hashes
        if: steps.reuse.outputs.artifact_id != ''
        run: node scripts/ci-artifacts.mjs verify bundles

      - name: Fetch build resources when no validated artifact exists
        if: steps.reuse.outputs.artifact_id == ''
        run: git lfs pull

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust toolchain
        if: steps.reuse.outputs.artifact_id == ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        if: steps.reuse.outputs.artifact_id == ''
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: windows-msvc-build
          save-if: 'false'

      - name: Install frontend dependencies
        if: steps.reuse.outputs.artifact_id == ''
        run: pnpm install --frozen-lockfile

      - run: pnpm audit --prod --audit-level=high
      - run: pnpm test:unit
        if: steps.reuse.outputs.artifact_id == ''
      - run: pnpm test:release
        if: steps.reuse.outputs.artifact_id == '' && hashFiles('tests/build/*.test.mjs') != ''
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
        if: steps.reuse.outputs.artifact_id == ''

      - name: Build Tauri app
        if: steps.reuse.outputs.artifact_id == ''
        # beforeBuildCommand performs the frontend build once.
        run: pnpm tauri:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create optional delta from the previous stable release
        id: delta
        # A missing historical asset must not prevent a valid full-installer release.
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundle = Join-Path $PWD 'src-tauri/target/release/bundle/nsis'
          $metadata = Join-Path $bundle 'update-delta.json'
          if (Test-Path -LiteralPath $metadata) { Remove-Item -LiteralPath $metadata }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $previous = @(gh release list --limit 30 --json tagName,isPrerelease,isDraft | ConvertFrom-Json) |
            Where-Object { !$_.isPrerelease -and !$_.isDraft -and $_.tagName -match '^v\d+\.\d+\.\d+$' -and [version]$_.tagName.Substring(1) -lt [version]$version } |
            Sort-Object { [version]$_.tagName.Substring(1) } -Descending | Select-Object -First 1
          if (!$previous) { Write-Host 'No older stable release; publishing full installer only.'; exit 0 }
          $base = $previous.tagName.Substring(1)
          $sourceDir = Join-Path $env:RUNNER_TEMP 'md-king-delta-base'
          New-Item -ItemType Directory -Path $sourceDir -Force | Out-Null
          gh release download $previous.tagName --pattern "md-king_${base}_x64-setup.exe" --dir $sourceDir --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the delta base installer' }
          & ./scripts/create-update-delta.ps1 -SourceInstaller (Join-Path $sourceDir "md-king_${base}_x64-setup.exe") -BaseVersion $previous.tagName
          if (Test-Path -LiteralPath $metadata) {
            $delta = Get-Content -LiteralPath $metadata -Raw | ConvertFrom-Json
            "asset=src-tauri/target/release/bundle/nsis/$($delta.asset)" >> $env:GITHUB_OUTPUT
          }

      - name: Sign update manifest
        run: node scripts/sign-update.mjs
        env:
          GITHUB_REF_NAME: ${{ inputs.tag || github.ref_name }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}

      - name: Create GitHub Release
        if: inputs.verify_only != true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            src-tauri/target/release/bundle/nsis/md-king_${{ steps.version.outputs.version }}_x64-setup.exe
            src-tauri/target/release/bundle/msi/md-king_${{ steps.version.outputs.version }}_x64_en-US.msi
            src-tauri/target/release/bundle/nsis/update-manifest.json
            src-tauri/target/release/bundle/nsis/update-manifest.sig
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            ${{ steps.delta.outputs.asset }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Store verification metadata without publishing
        if: inputs.verify_only == true
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            src-tauri/target/release/bundle/nsis/update-manifest.json
            src-tauri/target/release/bundle/nsis/update-manifest.sig
            src-tauri/target/release/bundle/nsis/update-delta.json
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
