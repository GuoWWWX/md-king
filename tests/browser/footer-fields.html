<!doctype html><html><head><meta charset="utf-8"><title>Dynamic footer preview regression</title></head><body><main id="preview"></main>
<script type="module">
import '/src/index.css';
import {createElement as h} from 'react';
import {createRoot} from 'react-dom/client';
import {WordPreviewPage} from '/src/components/templates/word-preview-page.tsx';
import {TooltipProvider} from '/src/components/ui/tooltip.tsx';
import {createDefaultTemplateStyleConfig} from '/src/lib/style-manager-data.ts';
const root=createRoot(document.querySelector('#preview'));
window.fixture={configure(format='page-total',start=3){
 const config=createDefaultTemplateStyleConfig('default-report');
 config.pageSettings={...config.pageSettings,tocEnabled:false,footerEnabled:true,footerText:'内部资料',footerPageNumberFormat:format,footerStartPage:start,pageNumberStartAt:'document'};

 root.render(h(TooltipProvider,null,h(WordPreviewPage,{markdown,styleConfig:config,paginate:true,showTocPage:false})));
}};
window.fixture.configure();
</script></body></html>
