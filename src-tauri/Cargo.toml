[package]
name = "md-king"
version = "1.1.8"
description = "AI Markdown to Word/WPS document converter"
authors = ["md-king contributors"]
edition = "2021"
default-run = "md-king"

[lib]
# The `_lib` suffix keeps the library name unique on Windows.
name = "md_king_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clap = { version = "4", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
zip = "5"
winreg = "0.55"
chrono = "0.4"
base64 = "0.22"
